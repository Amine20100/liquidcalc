name: Xcode Remote Desktop (RDP / Web VNC)

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: 'Session Duration in Hours (1-6)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '6'
      vnc_password:
        description: 'VNC / Remote Desktop Password'
        required: false
        default: 'LiquidCalc2026!'
      ngrok_token:
        description: 'Optional ngrok Auth Token (for direct TCP VNC tunnel)'
        required: false
        default: ''
      open_xcode:
        description: 'Automatically open LiquidCalc.xcodeproj in Xcode'
        required: false
        default: true
        type: boolean
      boot_simulator:
        description: 'Automatically boot iOS Simulator'
        required: false
        default: true
        type: boolean
      enable_tmate:
        description: 'Enable tmate SSH & Web Terminal'
        required: false
        default: true
        type: boolean

jobs:
  xcode-remote-desktop:
    name: macOS Xcode Remote Desktop
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify macOS & Xcode Environment
        run: |
          echo "=== macOS Runner Specifications ==="
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos
          echo "Runner User: $(whoami)"
          echo "Host Architecture: $(uname -m)"

      - name: Configure User Password & Screen Sharing (VNC)
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          echo "Configuring macOS Screen Sharing / VNC..."
          PASS="${VNC_PASSWORD:-LiquidCalc2026!}"
          
          # Set password for runner user
          sudo dscl . -passwd /Users/runner "$PASS" || echo "runner:$PASS" | sudo chpasswd || true
          
          # Enable Apple Remote Desktop / Screen Sharing service on port 5900
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers -privs -all \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PASS" \
            -restart -agent || true
            
          echo "Screen Sharing successfully activated on port 5900."

      - name: Setup Web-Based noVNC Client (In-Browser Desktop)
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          echo "Setting up noVNC web interface..."
          PASS="${VNC_PASSWORD:-LiquidCalc2026!}"
          rm -rf /tmp/noVNC
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC
          git clone --depth 1 https://github.com/novnc/websockify /tmp/noVNC/utils/websockify
          
          # Keep display awake and prevent sleeping
          caffeinate -u -d -i -m -s -t 86400 &
          
          # Reset and grant Screen Recording permission in TCC database
          sudo tccutil reset ScreenCapture || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000);" || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteDesktop',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000);" || true
          
          # Simulate keypress to wake WindowServer
          osascript -e 'tell application "System Events" to key code 123' || true
          
          # Check / configure display resolution via displayplacer
          brew install displayplacer || true
          displayplacer list || true

          # Inject bulletproof auto-connect & credentials into vnc.html
          cat << 'SCRIPT_EOF' > /tmp/inject_autoconnect.js
          <script>
          (function() {
            var params = new URLSearchParams(window.location.search);
            var updated = false;
            if (!params.has('autoconnect')) { params.set('autoconnect', 'true'); updated = true; }
            if (!params.has('resize')) { params.set('resize', 'remote'); updated = true; }
            if (!params.has('reconnect')) { params.set('reconnect', 'true'); updated = true; }
            if (!params.has('password')) { params.set('password', 'PASS_PLACEHOLDER'); updated = true; }
            if (updated) {
              window.location.search = params.toString();
            }
          })();
          </script>
          SCRIPT_EOF
          sed -i '' "s/PASS_PLACEHOLDER/$PASS/g" /tmp/inject_autoconnect.js
          sed -i '' '/<head>/r /tmp/inject_autoconnect.js' /tmp/noVNC/vnc.html || true

          # Create robust root index.html that auto-redirects to vnc.html with all parameters
          cat << EOF > /tmp/noVNC/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting to macOS Xcode Remote Desktop...</title>
            <meta http-equiv="refresh" content="0;url=vnc.html?autoconnect=true&resize=remote&reconnect=true&password=${PASS}">
            <style>
              body { background: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
              .card { background: rgba(30,41,59,0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
              a { color: #38bdf8; text-decoration: none; font-weight: 600; }
            </style>
          </head>
          <body>
            <div class="card">
              <h2>🍎 Connecting to Xcode Remote Desktop...</h2>
              <p>Redirecting automatically in 1 second.</p>
              <p><a href="vnc.html?autoconnect=true&resize=remote&reconnect=true&password=${PASS}">Click here if not redirected</a></p>
            </div>
            <script>
              window.location.replace("vnc.html?autoconnect=true&resize=remote&reconnect=true&password=${PASS}");
            </script>
          </body>
          </html>
          EOF

          # Start websockify proxying port 6080 -> 127.0.0.1:5900
          /tmp/noVNC/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 2
          echo "noVNC web proxy listening on http://127.0.0.1:6080"

      - name: Start Cloudflare Quick Tunnel (HTTP/2 Protocol)
        run: |
          echo "Installing Cloudflare Tunnel CLI..."
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cloudflared || curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64 -o /usr/local/bin/cloudflared && chmod +x /usr/local/bin/cloudflared || true
          
          # Launch Quick Tunnel with --protocol http2 (prevents Error 1033 UDP QUIC disconnects)
          echo "Starting Cloudflare Quick Tunnel on port 6080 with HTTP/2..."
          cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cloudflared_web.log 2>&1 &
          
          # Wait for tunnel URL generation
          for i in {1..30}; do
            WEB_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' /tmp/cloudflared_web.log | head -n 1)
            if [ -n "$WEB_URL" ]; then
              echo "CLOUDFLARE_WEB_URL=$WEB_URL" >> $GITHUB_ENV
              echo "Found Cloudflare Tunnel: $WEB_URL"
              break
            fi
            sleep 1
          done

      - name: Setup LocalTunnel (Secondary Instant Web Remote Desktop)
        run: |
          echo "Setting up LocalTunnel fallback on port 6080..."
          npx --yes localtunnel --port 6080 > /tmp/localtunnel.log 2>&1 &
          for i in {1..15}; do
            LT_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.loca\.lt' /tmp/localtunnel.log | head -n 1 || true)
            if [ -n "$LT_URL" ]; then
              echo "LOCALTUNNEL_URL=$LT_URL" >> $GITHUB_ENV
              echo "LocalTunnel URL: $LT_URL"
              break
            fi
            sleep 1
          done

      - name: Setup Pinggy Web & VNC Tunnels
        run: |
          echo "Starting Pinggy tunnels for Web (6080) and VNC (5900)..."
          # Web desktop forward (HTTP/HTTPS)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:6080 a.pinggy.io > /tmp/pinggy_web.log 2>&1 &
          # Native VNC TCP forward
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:5900 tcp@a.pinggy.io > /tmp/pinggy_tcp.log 2>&1 &
          sleep 4
          
          PINGGY_WEB=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.a\.pinggy\.link' /tmp/pinggy_web.log | head -n 1 || true)
          PINGGY_TCP=$(grep -o 'tcp://[-a-zA-Z0-9@:%._\+~#=]*:[0-9]*' /tmp/pinggy_tcp.log | head -n 1 || true)
          
          if [ -n "$PINGGY_WEB" ]; then
            echo "PINGGY_WEB_URL=$PINGGY_WEB" >> $GITHUB_ENV
            echo "Pinggy Web URL: $PINGGY_WEB"
          fi
          if [ -n "$PINGGY_TCP" ]; then
            echo "PINGGY_TCP_URL=$PINGGY_TCP" >> $GITHUB_ENV
            echo "Pinggy TCP VNC URL: $PINGGY_TCP"
          fi

      - name: Setup Bore TCP Tunnel (Direct Native VNC Client Access)
        run: |
          echo "Setting up Bore TCP tunnel for VNC port 5900..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-aarch64-apple-darwin.tar.gz | tar -xz -C /tmp/ || true
          if [ -f /tmp/bore ]; then
            chmod +x /tmp/bore
            /tmp/bore local 5900 --to bore.pub > /tmp/bore.log 2>&1 &
            sleep 3
            BORE_PORT=$(grep -o 'listening at bore.pub:[0-9]*' /tmp/bore.log | grep -o '[0-9]*$' | head -n 1 || true)
            if [ -n "$BORE_PORT" ]; then
              echo "BORE_VNC_ADDR=bore.pub:$BORE_PORT" >> $GITHUB_ENV
              echo "Bore VNC Address: bore.pub:$BORE_PORT"
            fi
          fi

      - name: Setup ngrok TCP Tunnel (Optional Direct VNC Port Forward)
        env:
          NGROK_INPUT_TOKEN: ${{ inputs.ngrok_token }}
          NGROK_SECRET_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          TOKEN="${NGROK_INPUT_TOKEN:-$NGROK_SECRET_TOKEN}"
          if [ -n "$TOKEN" ]; then
            echo "Installing ngrok..."
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ngrok/ngrok/ngrok || curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip -o /tmp/ngrok.zip && unzip /tmp/ngrok.zip -d /usr/local/bin/ || true
            ngrok config add-authtoken "$TOKEN"
            echo "Starting ngrok TCP tunnel for port 5900..."
            ngrok tcp 5900 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 3
            NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[-a-zA-Z0-9@:%._\+~#=]*:[0-9]*' | head -n 1)
            if [ -n "$NGROK_URL" ]; then
              echo "NGROK_TCP_URL=$NGROK_URL" >> $GITHUB_ENV
              echo "ngrok TCP VNC URL: $NGROK_URL"
            fi
          else
            echo "No ngrok token provided. Skipping ngrok tunnel."
          fi


      - name: Launch Xcode Project & Boot iOS Simulator (Background)
        run: |
          if [ "${{ inputs.boot_simulator }}" = "true" ]; then
            echo "Booting iOS Simulator in background..."
            (open -a Simulator; sleep 2; xcrun simctl boot "iPhone 15 Pro" || xcrun simctl boot "iPhone 15" || true) > /tmp/sim.log 2>&1 &
          fi

          if [ "${{ inputs.open_xcode }}" = "true" ]; then
            echo "Opening LiquidCalc.xcodeproj in Xcode in background..."
            open LiquidCalc.xcodeproj > /tmp/xcode.log 2>&1 &
          fi

      - name: Display Connection Dashboard & Credentials
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
          SESSION_HOURS: ${{ inputs.session_hours }}
        run: |
          PASS="${VNC_PASSWORD:-LiquidCalc2026!}"

          # Primary Web URL (with autoconnect & reconnect)
          CF_DIRECT="${CLOUDFLARE_WEB_URL}/vnc.html?autoconnect=true&resize=remote&reconnect=true&password=${PASS}"
          LT_DIRECT="${LOCALTUNNEL_URL}/vnc.html?autoconnect=true&resize=remote&reconnect=true&password=${PASS}"
          PG_DIRECT="${PINGGY_WEB_URL}/vnc.html?autoconnect=true&resize=remote&reconnect=true&password=${PASS}"

          echo "==============================================================="
          echo "               🍎 XCODE REMOTE DESKTOP READY                   "
          echo "==============================================================="
          if [ -n "$CLOUDFLARE_WEB_URL" ]; then
            echo "🖥️  Web Desktop (Cloudflare): $CF_DIRECT"
          fi
          if [ -n "$LOCALTUNNEL_URL" ]; then
            echo "🖥️  Web Desktop (LocalTunnel): $LT_DIRECT"
          fi
          if [ -n "$PINGGY_WEB_URL" ]; then
            echo "🖥️  Web Desktop (Pinggy):     $PG_DIRECT"
          fi
          if [ -n "$BORE_VNC_ADDR" ]; then
            echo "🔌  Bore Native VNC:           $BORE_VNC_ADDR"
          fi
          if [ -n "$PINGGY_TCP_URL" ]; then
            echo "🔌  Pinggy Native VNC:         $PINGGY_TCP_URL"
          fi
          if [ -n "$NGROK_TCP_URL" ]; then
            echo "🔌  ngrok Native VNC:          $NGROK_TCP_URL"
          fi
          echo "👤  Username:                  runner"
          echo "🔑  Password:                  $PASS"
          echo "⏱️  Session Duration:          ${SESSION_HOURS} hours"
          echo "==============================================================="

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # 🍎 Xcode Remote Desktop Connected & Active

          ### 🚀 1-Click Instant In-Browser Remote Access
          $(if [ -n "$PINGGY_WEB_URL" ]; then echo "- 🖥️ **[Open Pinggy Web Desktop](${PG_DIRECT})** *(Recommended In-Browser Desktop)*"; fi)
          $(if [ -n "$CLOUDFLARE_WEB_URL" ]; then echo "- 🖥️ **[Open Cloudflare Web Desktop](${CF_DIRECT})**"; fi)
          $(if [ -n "$LOCALTUNNEL_URL" ]; then echo "- 🖥️ **[Open LocalTunnel Web Desktop](${LT_DIRECT})**"; fi)

          ---

          ### 🔑 Connection Credentials
          | Parameter | Value |
          | :--- | :--- |
          | **Host OS** | macOS Sonoma 14 (Apple Silicon) |
          | **Username** | \`runner\` |
          | **Password** | \`${PASS}\` |
          | **VNC Port** | \`5900\` |
          | **Pre-loaded App** | Xcode 15.4 / 16 (\`LiquidCalc.xcodeproj\`) & iOS Simulator |
          | **Session Duration** | **${SESSION_HOURS} Hours** |

          ---

          ### 🔌 Native VNC Client Connection (RealVNC / TigerVNC / UltraVNC)
          You can connect directly with any VNC client using the host address below:
          $(if [ -n "$BORE_VNC_ADDR" ]; then echo "- **Bore VNC Server**: \`$BORE_VNC_ADDR\`"; fi)
          $(if [ -n "$PINGGY_TCP_URL" ]; then echo "- **Pinggy VNC Server**: \`$PINGGY_TCP_URL\`"; fi)
          $(if [ -n "$NGROK_TCP_URL" ]; then echo "- **ngrok VNC Server**: \`$NGROK_TCP_URL\`"; fi)
          - **VNC Password**: \`${PASS}\`

          ---

          > [!TIP]
          > **How to control your session:**
          > - Xcode and iOS Simulator are launched automatically in the background.
          > - To terminate the remote desktop early, cancel this GitHub Actions workflow run in the Actions tab.
          EOF

      - name: Keep-Alive & Watchdog Session Loop
        env:
          SESSION_HOURS: ${{ inputs.session_hours }}
        run: |
          HOURS="${SESSION_HOURS:-3}"
          SECONDS_TOTAL=$(( HOURS * 3600 ))
          echo "Session started for $HOURS hours ($SECONDS_TOTAL seconds)."
          echo "Watchdog monitoring active: maintaining Cloudflare, noVNC, and tunnels."

          ELAPSED=0
          while [ $ELAPSED -lt $SECONDS_TOTAL ]; do
            # Watchdog: ensure noVNC is running
            if ! pgrep -f "novnc_proxy" > /dev/null; then
              echo "[Watchdog] Restarting noVNC proxy..."
              /tmp/noVNC/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
            fi

            # Watchdog: ensure cloudflared is running
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "[Watchdog] Restarting cloudflared tunnel..."
              cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cloudflared_web.log 2>&1 &
            fi

            REMAINING=$(( SECONDS_TOTAL - ELAPSED ))
            REMAINING_MINS=$(( REMAINING / 60 ))
            if (( ELAPSED % 300 == 0 )); then
              echo "[$(date '+%H:%M:%S')] Remote Desktop active. Remaining time: ${REMAINING_MINS} minutes."
            fi
            sleep 30
            ELAPSED=$(( ELAPSED + 30 ))
          done

          echo "Session duration elapsed. Exiting cleanly."
