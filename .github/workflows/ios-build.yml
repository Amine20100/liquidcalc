name: Build LiquidCalc iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Build iOS Application (Release)
        run: |
          xcodebuild build \
            -project LiquidCalc.xcodeproj \
            -scheme LiquidCalc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app and .ipa Artifacts
        run: |
          mkdir -p output/Payload
          if [ -d "build/Build/Products/Release-iphoneos/LiquidCalc.app" ]; then
            cp -R build/Build/Products/Release-iphoneos/LiquidCalc.app output/Payload/
            cp -R build/Build/Products/Release-iphoneos/LiquidCalc.app output/
          else
            echo "Searching for built LiquidCalc.app..."
            find build -name "LiquidCalc.app" -exec cp -R {} output/Payload/ \;
            find build -name "LiquidCalc.app" -exec cp -R {} output/ \;
          fi
          cd output
          zip -r LiquidCalc.zip LiquidCalc.app
          zip -r LiquidCalc.ipa Payload
          rm -rf Payload

      - name: Setup Cloudflare Tunnel for Fast OTA Distribution
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          echo "Installing Cloudflare Tunnel CLI (cloudflared)..."
          brew install cloudflared || curl -L --output /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64 && chmod +x /usr/local/bin/cloudflared || true
          
          # Copy distribution manifests into output
          cp manifest.plist output/ || true
          cp apps.json output/ || true
          cp hotpatch.json output/ || true
          
          echo "### 🚀 Cloudflare Distribution & Wireless OTA Ready" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct OTA Manifest**: https://raw.githubusercontent.com/Amine20100/liquidcalc/main/manifest.plist" >> $GITHUB_STEP_SUMMARY
          echo "- **In-App Hot Patch**: https://raw.githubusercontent.com/Amine20100/liquidcalc/main/hotpatch.json" >> $GITHUB_STEP_SUMMARY
          echo "- **AltStore / SideStore Source**: https://raw.githubusercontent.com/Amine20100/liquidcalc/main/apps.json" >> $GITHUB_STEP_SUMMARY

      - name: Upload Built iOS IPA (for Sideloadly / AltStore / Direct OTA)
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCalc-IPA
          path: output/LiquidCalc.ipa
          retention-days: 14

      - name: Upload Built iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCalc-iOS-App
          path: output/LiquidCalc.zip
          retention-days: 14

      - name: Attach IPA & App to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attaching LiquidCalc.ipa and LiquidCalc.zip to release..."
          gh release upload v2.5.0 output/LiquidCalc.ipa output/LiquidCalc.zip --clobber || echo "Release upload skipped or completed"

      - name: Run Test Suite
        if: always()
        run: |
          xcodebuild test \
            -project LiquidCalc.xcodeproj \
            -scheme LiquidCalcTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Results
          path: TestResults.xcresult
          retention-days: 14
