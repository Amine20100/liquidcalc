name: Build LiquidCalc iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Run Test Suite
        run: |
          xcodebuild test \
            -project LiquidCalc.xcodeproj \
            -scheme LiquidCalcTests \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Application (Release)
        run: |
          xcodebuild build \
            -project LiquidCalc.xcodeproj \
            -scheme LiquidCalc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app Artifact
        run: |
          mkdir -p output
          cp -R build/Build/Products/Release-iphoneos/LiquidCalc.app output/
          cd output && zip -r LiquidCalc.zip LiquidCalc.app

      - name: Upload Built iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCalc-iOS-App
          path: output/LiquidCalc.zip
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Results
          path: TestResults.xcresult
          retention-days: 14
