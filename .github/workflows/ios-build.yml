name: Build LiquidCalc iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Build iOS Application (Release)
        run: |
          xcodebuild build \
            -project LiquidCalc.xcodeproj \
            -scheme LiquidCalc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app Artifact
        run: |
          mkdir -p output
          if [ -d "build/Build/Products/Release-iphoneos/LiquidCalc.app" ]; then
            cp -R build/Build/Products/Release-iphoneos/LiquidCalc.app output/
            cd output && zip -r LiquidCalc.zip LiquidCalc.app
          else
            echo "Searching for built LiquidCalc.app..."
            find build -name "LiquidCalc.app" -exec cp -R {} output/ \;
            cd output && zip -r LiquidCalc.zip LiquidCalc.app
          fi

      - name: Upload Built iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCalc-iOS-App
          path: output/LiquidCalc.zip
          retention-days: 14

      - name: Run Test Suite
        if: always()
        run: |
          xcodebuild test \
            -project LiquidCalc.xcodeproj \
            -scheme LiquidCalcTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Results
          path: TestResults.xcresult
          retention-days: 14
